[package]
name = "lem-os-agent"
description = "Lem's OS agent: the desktop's clipboard, and later its tray and notifications, for one editor session over lem.os.v1."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
# Wayland through the data-control protocol (wlroots compositors such as
# sway, KDE), X11 otherwise: an X11-only clipboard is not bridged to
# Wayland applications by every compositor.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
lem-protocols = { path = "../lem-protocols" }
prost = "0.14"

[dev-dependencies]
tempfile = "3"
