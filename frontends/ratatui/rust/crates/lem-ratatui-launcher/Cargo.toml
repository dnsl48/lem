[package]
name = "lem-ratatui-launcher"
description = "Starts Lem and its terminal display, and connects them; the OS-facing half of lem-ratatui."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
duct = "1.1.2"
os_pipe = "1.2.3"
zstd = { version = "0.14.0", optional = true }

[build-dependencies]
zstd = { version = "0.14.0", optional = true, features = ["zstdmt"] }

[features]
# Embed the Lisp image and the display binary so the launcher runs on its
# own; see src/bundle.rs.
bundle = ["dep:zstd"]
