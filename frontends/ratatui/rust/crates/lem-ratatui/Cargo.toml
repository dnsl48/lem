[package]
name = "lem-ratatui"
description = "Terminal display half for Lem: paints lem-server protocol frames with crossterm."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
lem-protocol = { path = "../lem-protocol" }
ratatui-core = "0.1.2"
ratatui-crossterm = "0.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zstd = { version = "0.14.0", optional = true }

[build-dependencies]
zstd = { version = "0.14.0", optional = true, features = ["zstdmt"] }

[features]
# Embed the saved Lisp image so the binary runs on its own; see src/bundle.rs.
bundle = ["dep:zstd"]
