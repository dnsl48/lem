[package]
name = "lem-ratatui"
description = "Terminal display half for Lem: paints lem.display.v1 frames with crossterm."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
lem-protocols = { path = "../lem-protocols" }
prost = "0.14"
# The buffer, with its grapheme and width handling, and its diff. Not
# ratatui-crossterm: src/present.rs writes to the terminal (ADR 0016).
ratatui-core = { version = "0.1.2", features = ["underline-color"] }
terminal-colorsaurus = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }
