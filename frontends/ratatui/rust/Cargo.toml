[workspace]
resolver = "3"
members = ["crates/lem-protocol", "crates/lem-ratatui", "crates/lem-ratatui-launcher"]
exclude = ["vendor/crossterm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lem-project/lem"

[workspace.lints.clippy]
all = "warn"

# The self-contained binary (`make dist`). Its own profile so it builds into
# target/dist/ and doesn't clobber the release binary the launcher runs.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true

# Local, documented terminal-query and control-byte fixes against upstream 0.29.0.
[patch.crates-io]
crossterm = { path = "vendor/crossterm" }
