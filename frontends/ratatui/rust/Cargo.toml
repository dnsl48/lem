[workspace]
resolver = "3"
members = ["crates/lem-protocol", "crates/lem-ratatui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lem-project/lem"

[workspace.lints.clippy]
all = "warn"

# The self-contained binary (`make dist`). Its own profile so it builds into
# target/dist/ and doesn't clobber the release binary the launcher runs.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = true
